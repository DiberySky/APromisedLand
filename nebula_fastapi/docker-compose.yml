version: '3.8'

services:
  nebula-api:
    build: .
    container_name: nebula-fastapi
    ports:
      - "8000:8000"
    environment:
      - NEBULA_HOSTS=nebula-graphd:9669
      - NEBULA_USER=root
      - NEBULA_PASSWORD=nebula
      - NEBULA_SPACE=basketballplayer
      - NEBULA_MAX_CONN_POOL_SIZE=20
      - DEBUG=false
    depends_on:
      - nebula-graphd
    networks:
      - nebula-network
    restart: unless-stopped

  # NebulaGraph services (simplified - use official compose for production)
  nebula-metad:
    image: vesoft/nebula-metad:v3.6.0
    container_name: nebula-metad
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    volumes:
      - nebula-meta:/data/meta
      - nebula-logs:/logs
    networks:
      - nebula-network
    restart: unless-stopped

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.6.0
    container_name: nebula-graphd
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
      - --port=9669
      - --ws_http_port=19669
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    ports:
      - "9669:9669"
    volumes:
      - nebula-logs:/logs
    depends_on:
      - nebula-metad
      - nebula-storaged
    networks:
      - nebula-network
    restart: unless-stopped

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.6.0
    container_name: nebula-storaged
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    volumes:
      - nebula-storage:/data/storage
      - nebula-logs:/logs
    depends_on:
      - nebula-metad
    networks:
      - nebula-network
    restart: unless-stopped

volumes:
  nebula-meta:
  nebula-storage:
  nebula-logs:

networks:
  nebula-network:
    driver: bridge
